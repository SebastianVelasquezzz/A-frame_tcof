<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Bosque Oscuro en 360</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <!-- 1. Cargamos el archivo exacto que tienes en tu carpeta -->
        <img id="mi-bosque" src="Gemini_Generated_Image_e4s2s0e4s2s0e4s2.jpg">
      </a-assets>

      <!-- 2. Llamamos a la imagen usando el símbolo '#' seguido del id -->
      <a-sky src="#mi-bosque"></a-sky>

      <!-- 3. Cámara con rotación automática -->
      <a-entity 
        camera look-controls 
        position="0 1.6 0"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 30000; easing: linear">
      </a-entity>

    </a-scene>
  </body>
</html>
